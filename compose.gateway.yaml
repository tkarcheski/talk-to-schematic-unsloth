# Standalone Linux gateway for an existing private/loopback inference endpoint.
# cspell:words tmpfs nosuid nodev pids healthcheck venv urllib urlopen
# Host networking permits reaching a host-local server; UI remains loopback-only.
name: ask-the-schematic-gateway
services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    command: [deploy, gateway, --config, /config/agent.json, --bind, 127.0.0.1, --port, "8893"]
    volumes:
      - type: bind
        source: ${SCHEMATIC_AGENT_CONFIG:-./config/compose-agent.json}
        target: /config/agent.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    init: true
    restart: unless-stopped
    logging:
      driver: none
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8893/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
