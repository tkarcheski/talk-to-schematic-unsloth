minimum_pre_commit_version: '4.0.0'
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: delivery-checks
        name: Fresh base and substantive proposal
        entry: uv run --locked python scripts/check_delivery.py
        language: system
        pass_filenames: false
        always_run: true
        fail_fast: true
        stages: [pre-commit]
      - id: delivery-push-checks
        name: Live remote base and published proposal
        entry: uv run --locked python scripts/check_delivery.py --push
        language: system
        pass_filenames: false
        always_run: true
        fail_fast: true
        stages: [pre-push]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=2048']
        exclude: ^data/manifest\.json$
  - repo: local
    hooks:
      - id: ai-pilled-review
        name: ai-pilled automatic staged review
        entry: uv run --locked ai-pilled hook commit-msg
        language: system
        stages: [commit-msg]
        always_run: true
      - id: ai-pilled-checks
        name: ai-pilled comprehensive staged checks
        entry: uv run --locked ai-pilled hook pre-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ai-pilled-scan
        name: ai-pilled staged credential scan
        stages: [pre-push]
        entry: uv run --locked ai-pilled scan
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: Ruff correctness checks
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: cspell
        name: CSpell source and documentation
        entry: npm exec --no -- cspell lint --no-progress --no-must-find-files --gitignore
        language: system
        types: [text]
        files: \.(md|py|yml|yaml|toml|js|mjs|css|html)$
      - id: prettier
        name: Browser source formatting
        entry: npm exec --no -- prettier --check
        language: system
        files: ^(schematic_model/web/.*\.(html|css|js|svg)|scripts/.*\.mjs)$
      - id: tests
        name: CPU regression suite
        entry: uv run --locked pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: browser-state-tests
        name: Browser state regression suite
        entry: npm run test:browser-state
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
