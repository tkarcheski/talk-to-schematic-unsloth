minimum_pre_commit_version: '4.0.0'
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit, manual]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=2048']
        exclude: ^data/manifest\.json$
  - repo: local
    hooks:
      - id: ai-pilled-review
        name: ai-pilled automatic staged review
        entry: uv run --locked python -m ai_pilled hook commit-msg
        language: system
        stages: [commit-msg]
        always_run: true
      - id: ai-pilled-checks
        name: ai-pilled comprehensive staged checks
        entry: uv run --locked python -m ai_pilled hook pre-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: worktree-policy
        name: bounded worktree lifecycle
        stages: [pre-push]
        entry: uv run --locked python scripts/check_worktrees.py check
        language: system
        pass_filenames: false
        always_run: true
      - id: ai-pilled-full-audit
        name: ai-pilled complete committed audit and three model reviews
        stages: [pre-push]
        entry: uv run --locked python scripts/audit_repository.py --model-reviews
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: Ruff correctness checks
        entry: uv run --locked python -m ruff check
        language: system
        types: [python]
        stages: [pre-commit]
      - id: cspell
        name: CSpell source and documentation
        entry: npm exec --no -- cspell lint --no-progress --no-must-find-files --gitignore
        language: system
        types: [text]
        files: \.(md|py|yml|yaml|toml|js|mjs|css|html)$
      - id: prettier
        name: Browser source formatting
        entry: npm exec --no -- prettier --check
        language: system
        files: ^(schematic_model/web/.*\.(html|css|js|svg)|scripts/.*\.mjs)$
      - id: browser-state-tests
        name: Browser state regression suite
        entry: npm run test:browser-state
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
