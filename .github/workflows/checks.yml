# cspell:words deadcode venv
name: Package checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.19'
          python-version: '3.13'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:browser-state
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: uv sync --locked
      - run: uv run --locked pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ai-pilled-checks
      - run: uv run --locked ai-pilled scan --scope worktree
      - run: uv run --locked ai-pilled check typecheck
      - run: uv run --locked ai-pilled check deadcode
      - run: uv run --locked ai-pilled check dependency
      - run: uv run --locked ai-pilled check coverage
      - run: uv build

  gateway-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up --build --no-deps -d gateway
      - run: docker compose exec -T gateway /app/.venv/bin/python < docker/smoke_gateway.py
      - if: always()
        run: docker compose down --remove-orphans
