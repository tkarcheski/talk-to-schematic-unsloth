# cspell:words SEARXNG tmpfs nosuid nodev venv urllib urlopen
name: Package checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.19'
          python-version: '3.13'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:browser-state
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser-agent
      - run: npm run test:browser-navigation
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pre-commit run --all-files --show-diff-on-failure
      - run: uv run --locked coverage run -m pytest -q
      - run: uv run --locked coverage report
      - run: uv build
  gateway-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.examples.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.search.yaml config --quiet
        env:
          SEARXNG_SECRET: ci-configuration-validation-only
      - run: docker build -t schematic-gateway:test .
      - name: Verify isolated gateway image
        shell: bash
        run: |
          docker run -d --name gateway-test --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=128m --cap-drop ALL --security-opt no-new-privileges --mount type=bind,src="$PWD/config/compose-agent.json",dst=/config/agent.json,readonly schematic-gateway:test
          trap 'docker rm -f gateway-test' EXIT
          for attempt in {1..20}; do
            if docker exec gateway-test /app/.venv/bin/python -c "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8893/api/agent/config',timeout=2)); assert data['network']=='disabled'"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
