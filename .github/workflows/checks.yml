# cspell:words deadcode pipefail venv
name: Package checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Branch protection requires this exact check name; retain it when changing its implementation.
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # System and browser dependencies belong to a disposable image, not the hosted runner.
      - name: Build isolated CPU and browser toolchain
        run: docker build --file docker/Dockerfile.tests --tag schematic-tests .
      - name: Run complete CPU and browser checks without elevated privileges
        shell: bash
        run: |
          # Mount only this credential-free checkout. Do not expose the Docker socket or host homes.
          docker run --rm --init --interactive --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges --shm-size 1g \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace --env CI=true schematic-tests bash -euo pipefail -s <<'CHECKS'
          npm ci --ignore-scripts
          node -e 'const assert = require("node:assert/strict"); assert.equal(require("@playwright/test/package.json").version, process.env.PLAYWRIGHT_VERSION, "Update the test image browser when Playwright changes");'
          uv sync --locked
          # Run every deterministic source hook; staged model-review hooks need private credentials.
          for hook in check-merge-conflict check-yaml check-toml check-json check-added-large-files ruff cspell prettier; do
            uv run --locked python -m pre_commit run "$hook" --all-files --show-diff-on-failure
          done
          uv run --locked ai-pilled scan --scope worktree
          uv run --locked ai-pilled check lint
          uv run --locked ai-pilled check typecheck
          uv run --locked ai-pilled check deadcode
          uv run --locked ai-pilled check dependency
          # This coverage check executes the complete CPU suite before enforcing its coverage floor.
          uv run --locked ai-pilled check coverage
          npm run test:browser-state
          npm run test:browser-agent
          npm run test:browser-navigation
          npm run test:browser-comparison
          uv build
          CHECKS

  gateway-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up --build --no-deps -d gateway
      - run: docker compose exec -T gateway /app/.venv/bin/python < docker/smoke_gateway.py
      - if: always()
        run: docker compose down --remove-orphans
