name: Repository audit
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.19'
          python-version: '3.13'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: uv sync --locked
      - name: Full deterministic ai-pilled audit
        run: uv run --locked python scripts/audit_repository.py
      - name: Source format, spelling, and configuration checks
        run: uv run --locked python -m pre_commit run --all-files --hook-stage manual --show-diff-on-failure
      - run: npm run test:browser-state
      - run: uv build
