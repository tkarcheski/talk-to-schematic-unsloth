name: Package checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.19'
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:browser-state
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pre-commit run --all-files --show-diff-on-failure
      - run: uv run --locked coverage run -m pytest -q
      - run: uv run --locked coverage report
      - run: uv build
