[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "talk-to-schematic"
version = "0.1.0"
description = "Grounded schematic datasets, evaluation, and Unsloth fine-tuning"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pillow>=11,<13",
]

[project.scripts]
schematic-model = "schematic_model.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "coverage>=7,<8",
    "pre-commit>=4,<5",
]

[tool.setuptools]
packages = ["schematic_model"]
py-modules = ["evaluate", "chat"]

[tool.setuptools.package-data]
schematic_model = ["skills/*/SKILL.md", "web/*"]

[tool.coverage.run]
branch = true
source = ["schematic_model", "evaluate", "chat"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["data", "outputs", "results"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
