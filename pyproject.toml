[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "talk-to-schematic"
version = "0.1.0"
description = "Grounded schematic datasets, evaluation, and Unsloth fine-tuning"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pillow>=13,<14",
]

[project.scripts]
schematic-model = "schematic_model.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "coverage>=7,<8",
    "pre-commit>=4,<5",
    "jinja2>=3.1,<4",
    "ai-pilled",
    "mypy>=2.4,<3",
    "vulture>=2.14,<3",
    "pip-audit>=2.9,<3",
]

[tool.setuptools]
packages = ["schematic_model"]
py-modules = ["evaluate", "chat"]

[tool.setuptools.package-data]
schematic_model = ["skills/*/SKILL.md", "web/*", "web/vendor/*"]

[tool.coverage.run]
branch = true
source = ["."]

[tool.coverage.report]
include = ["schematic_model/*", "evaluate.py", "chat.py"]
precision = 2
fail_under = 75.1
show_missing = true
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["data", "outputs", "results"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.uv.sources]
ai-pilled = { git = "https://github.com/tkarcheski/ai-pilled.git", rev = "798fee64662e844afa4b38da824eb2aa928be280" }

[tool.mypy]
files = ["schematic_model", "evaluate.py", "chat.py", "scripts"]
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["unsloth", "unsloth.*", "torch", "torch.*", "transformers", "transformers.*", "trl", "trl.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ai_pilled", "ai_pilled.*"]
ignore_missing_imports = true
