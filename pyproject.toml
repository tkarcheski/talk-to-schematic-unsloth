[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "talk-to-schematic"
version = "0.1.0"
description = "Grounded schematic datasets, evaluation, and Unsloth fine-tuning"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pillow>=11,<13",
  "matplotlib>=3.10,<4",
  "schemdraw>=0.21,<0.23",
]

[project.scripts]
schematic-model = "schematic_model.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "coverage>=7,<8"]

[tool.setuptools]
packages = ["schematic_model"]
py-modules = ["hwsynth", "build_dataset", "evaluate", "make_mock_preds", "predict", "chat", "train_unsloth"]

[tool.setuptools.package-data]
schematic_model = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["data", "outputs", "results"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
